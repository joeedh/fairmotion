name: Deploy html5 app to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the deploy-pages action to publish, and let it read the OIDC token
# it uses to authenticate against the Pages API.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue the newest and let in-flight ones finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # The electron binary is only needed by the desktop target, and it is a
        # ~100MB download; the html5 build never touches it.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Build html5 app
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/html5app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 10min. A deployment that sits queued past the timeout is
          # cancelled by the action, and Pages keys deployments by commit SHA --
          # so every retry of that commit fails instantly on the dead one.
          timeout: 1800000
